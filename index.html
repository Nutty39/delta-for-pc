<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delta Executor</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden}
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
.bg-glow{position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:800px;height:600px;background:radial-gradient(ellipse,rgba(180,20,20,.18) 0%,transparent 70%);pointer-events:none;z-index:0}
.container{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:0 24px}
nav{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.nav-logo{font-family:'Orbitron',monospace;font-size:22px;font-weight:900;color:#fff;letter-spacing:4px;text-transform:uppercase}
.nav-logo span{color:#cc2020}
.nav-links{display:flex;gap:24px}
.nav-links a{color:rgba(255,255,255,.5);text-decoration:none;font-size:15px;font-weight:600;letter-spacing:1px;text-transform:uppercase;transition:color .2s}
.nav-links a:hover{color:#fff}
.hero{display:block;text-align:center;padding:60px 0 40px}
.logo-wrap{display:inline-block;margin-bottom:32px}
.logo-wrap img{width:160px;height:160px;object-fit:contain;filter:drop-shadow(0 0 30px rgba(220,30,30,.6));animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 30px rgba(220,30,30,.6))}50%{filter:drop-shadow(0 0 60px rgba(220,30,30,.9))}}
.hero-title{font-family:'Orbitron',monospace;font-size:64px;font-weight:900;letter-spacing:8px;text-transform:uppercase;line-height:1;margin-bottom:8px}
.hero-title span{color:#cc2020}
.hero-sub{font-size:18px;color:rgba(255,255,255,.45);letter-spacing:3px;text-transform:uppercase;margin-bottom:40px}
.btn-download{display:inline-flex;align-items:center;gap:12px;background:#cc2020;color:#fff;font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:16px 40px;border:none;cursor:pointer;clip-path:polygon(12px 0%,100% 0%,calc(100% - 12px) 100%,0% 100%);transition:background .2s,transform .15s;text-decoration:none}
.btn-download:hover{background:#e02525;transform:scale(1.03)}
.btn-sub{display:block;margin-top:14px;font-size:13px;color:rgba(255,255,255,.3);letter-spacing:1px;text-transform:uppercase}
.divider{border:none;border-top:1px solid rgba(255,255,255,.07);margin:50px 0}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:50px}
.feat{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);padding:24px;position:relative;overflow:hidden;transition:border-color .2s}
.feat:hover{border-color:rgba(204,32,32,.4)}
.feat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#cc2020,transparent);opacity:0;transition:opacity .2s}
.feat:hover::before{opacity:1}
.feat-icon{font-size:28px;margin-bottom:12px;color:#cc2020}
.feat-title{font-size:16px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.feat-desc{font-size:14px;color:rgba(255,255,255,.4);line-height:1.5}
.version-block{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);padding:20px 28px;margin-bottom:16px}
.version-info{display:flex;align-items:center;gap:20px}
.version-badge{background:#cc2020;font-family:'Orbitron',monospace;font-size:11px;font-weight:700;letter-spacing:2px;padding:4px 12px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.version-name{font-size:17px;font-weight:700;letter-spacing:1px}
.version-date{font-size:13px;color:rgba(255,255,255,.35)}
.btn-dl-sm{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid rgba(255,255,255,.2);color:#fff;font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:10px 22px;cursor:pointer;transition:border-color .2s,background .2s;text-decoration:none}
.btn-dl-sm:hover{border-color:#cc2020;background:rgba(204,32,32,.1)}
footer{text-align:center;padding:32px 0;border-top:1px solid rgba(255,255,255,.06);color:rgba(255,255,255,.2);font-size:13px;letter-spacing:1px;text-transform:uppercase}
footer span{color:#cc2020}
</style>
</head>
